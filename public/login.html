<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Society EV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card form-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Member login</h1>
        <form id="loginForm">
          <label>
            Email
            <input type="email" name="email" placeholder="you@example.com" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="Enter password" required />
          </label>
          <button type="submit" class="primary-btn full-width">Login</button>
        </form>
        <p class="switch-link">
          New here? <a href="register.html">Register account</a>
        </p>
        <p class="demo-note">Demo admin: admin@society.com / admin123</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
